<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <title>BusBook Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
        :root
        {
            --bg: #f1f5f9;
            --bg-elevated: #ffffff;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-glass: rgba(255, 255, 255, 0.90);
            --ink: #0f172a;
            --ink-soft: #334155;
            --muted: #64748b;
            --line: #e2e8f0;
            --line-strong: #cbd5e1;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --accent-soft: rgba(245, 158, 11, 0.14);
            --accent-ink: #1e1600;
            --brand: #059669;
            --brand-soft: rgba(5, 150, 105, 0.12);
            --go: #10b981;
            --go-soft: rgba(16, 185, 129, 0.15);
            --bad: #ef4444;
            --bad-soft: rgba(239, 68, 68, 0.12);
            --info: #3b82f6;
            --info-soft: rgba(59, 130, 246, 0.12);
            --seat: #f1f5f9;
            --seat-border: #cbd5e1;
            --taken: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.14);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            color-scheme: light;
        }

        :root[data-theme="dark"]
        {
            --bg: #070e17;
            --bg-elevated: #0d1826;
            --surface: #111f30;
            --surface-2: #16283d;
            --surface-glass: rgba(13, 24, 38, 0.92);
            --ink: #f1f5f9;
            --ink-soft: #cbd5e1;
            --muted: #94a3b8;
            --line: #1e344d;
            --line-strong: #2d4a6a;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --accent-soft: rgba(251, 191, 36, 0.15);
            --accent-ink: #1a1200;
            --brand: #10b981;
            --brand-soft: rgba(16, 185, 129, 0.16);
            --go: #10b981;
            --go-soft: rgba(16, 185, 129, 0.18);
            --bad: #f87171;
            --bad-soft: rgba(248, 113, 113, 0.15);
            --info: #60a5fa;
            --info-soft: rgba(96, 165, 250, 0.15);
            --seat: #182b42;
            --seat-border: #2c4766;
            --taken: #0d1724;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.38);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
            color-scheme: dark;
        }

        *
        {
            box-sizing: border-box;
        }

        html
        {
            scroll-behavior: smooth;
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        body
        {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 12% 8%, var(--accent-soft), transparent 28%),
                radial-gradient(circle at 88% 14%, var(--brand-soft), transparent 30%);
            background-attachment: fixed;
        }

        h1, h2, h3, h4, .display-font
        {
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            letter-spacing: -0.025em;
            margin: 0;
        }

        .mono
        {
            font-family: "JetBrains Mono", monospace;
        }

        
        header
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 16px;
            min-height: 48px;
            background: var(--surface-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 40;
            box-shadow: var(--shadow-sm);
            flex-wrap: nowrap;
        }

        .brand-wrap
        {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .brand-logo
        {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #ea580c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1200;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            flex-shrink: 0;
        }

        .brand-title
        {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .brand-title span
        {
            color: var(--accent);
        }

        .brand-badge
        {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 1px 6px;
            border-radius: 99px;
            background: var(--brand-soft);
            color: var(--go);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        nav
        {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
            align-items: center;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            max-width: 100%;
        }

        nav::-webkit-scrollbar
        {
            display: none;
        }

        nav button
        {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 5px 10px;
            font: 600 13px "Plus Jakarta Sans", sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.18s ease;
        }

        nav button:hover
        {
            background: var(--surface-2);
            color: var(--ink);
        }

        nav button.on
        {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(245, 158, 11, 0.35);
        }

        .nav-badge
        {
            background: var(--accent);
            color: var(--accent-ink);
            font-size: 10px;
            font-weight: 800;
            padding: 0 5px;
            border-radius: 99px;
            line-height: 1.4;
        }

        .theme-btn
        {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .theme-btn:hover
        {
            border-color: var(--accent);
        }

        .user-pill
        {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 4px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .user-avatar
        {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--go), #0284c7);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 10.5px;
        }

        
        main
        {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            padding: 18px 16px 50px;
            flex: 1;
        }

    
        .card
        {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card-interactive:hover
        {
            border-color: var(--line-strong);
            box-shadow: var(--shadow-md);
        }

        label
        {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--muted);
            margin: 10px 0 5px;
        }

        .input-group
        {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon
        {
            position: absolute;
            left: 13px;
            color: var(--muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-action
        {
            position: absolute;
            right: 10px;
            background: transparent;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .input-action:hover
        {
            color: var(--ink);
            background: var(--surface-2);
        }

        input, select
        {
            width: 100%;
            padding: 11px 13px;
            font: inherit;
            color: var(--ink);
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 11px;
            transition: all 0.2s ease;
        }

        .has-icon input, .has-icon select
        {
            padding-left: 38px;
        }

        input:focus, select:focus, button:focus-visible
        {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .btn
        {
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            color: var(--accent-ink);
            border: 0;
            border-radius: 11px;
            padding: 11px 18px;
            font: 700 13.5px "Plus Jakarta Sans", sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.22);
        }

        .btn:hover:not(:disabled)
        {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.32);
        }

        .btn:active:not(:disabled)
        {
            transform: translateY(0);
        }

        .btn:disabled
        {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn.ghost
        {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--line);
            box-shadow: none;
        }

        .btn.ghost:hover:not(:disabled)
        {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .btn.brand
        {
            background: linear-gradient(135deg, var(--go), #059669);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn.danger
        {
            background: var(--bad-soft);
            color: var(--bad);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: none;
        }

        .btn.danger:hover:not(:disabled)
        {
            background: var(--bad);
            color: #ffffff;
        }

        .btn.sm
        {
            padding: 7px 12px;
            font-size: 12.5px;
            border-radius: 9px;
        }

        .grid
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .grid3
        {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            align-items: end;
        }

        .grid4
        {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .row
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .muted
        {
            color: var(--muted);
            font-size: 13px;
        }

        .price
        {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.15;
        }

        .tag
        {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 99px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .tag.ac
        {
            background: var(--info-soft);
            color: var(--info);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .tag.sleeper
        {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(245, 158, 11, 0.35);
        }

        .tag.green
        {
            background: var(--go-soft);
            color: var(--go);
            border-color: rgba(16, 185, 129, 0.35);
        }

        .err
        {
            color: var(--bad);
            font-size: 13px;
            font-weight: 600;
            margin: 8px 0 0;
            min-height: 18px;
        }

        .ok
        {
            color: var(--go);
            font-weight: 700;
        }

    
        .auth-shell
        {
            display: grid;
            grid-template-columns: 1.15fr 0.95fr;
            gap: 24px;
            align-items: stretch;
            margin-top: 8px;
            min-height: 560px;
        }

        .auth-showcase
        {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            color: #ffffff;
            background: #09131c;
            box-shadow: var(--shadow-lg);
        }

        .auth-showcase-bg
        {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.55;
            transition: transform 8s ease;
        }

        .auth-showcase:hover .auth-showcase-bg
        {
            transform: scale(1.04);
        }

        .auth-showcase-overlay
        {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(7, 14, 23, 0.55) 0%,
                rgba(7, 14, 23, 0.72) 50%,
                rgba(7, 14, 23, 0.95) 100%
            );
        }

        .auth-showcase-content
        {
            position: relative;
            z-index: 2;
        }

        .auth-feature-grid
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .auth-stat-card
        {
            background: rgba(15, 23, 42, 0.68);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 12px;
        }

        .auth-stat-card b
        {
            display: block;
            font-size: 18px;
            font-family: "Bricolage Grotesque", sans-serif;
            color: #fbbf24;
        }

        .auth-stat-card span
        {
            font-size: 12px;
            color: #cbd5e1;
        }

        .auth-panel
        {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            margin-bottom: 0;
        }

        .tabs
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--line);
            margin: 14px 0 10px;
        }

        .tabs button
        {
            padding: 9px 12px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 13.5px;
            border: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pw-meter
        {
            margin-top: 8px;
        }

        .pw-bars
        {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            height: 5px;
            margin-bottom: 5px;
        }

        .pw-bar
        {
            background: var(--line);
            border-radius: 99px;
            transition: background 0.25s ease;
        }

        .demo-banner
        {
            margin-top: 14px;
            padding: 11px 13px;
            border-radius: 12px;
            background: var(--brand-soft);
            border: 1px dashed rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

    
        .search-hero
        {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid var(--line);
            background: var(--surface);
            box-shadow: var(--shadow-md);
        }

        .search-hero-banner
        {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            padding: 20px 22px;
            margin-bottom: 16px;
            color: #ffffff;
            background: #09131c;
        }

        .search-hero-banner img
        {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.42;
        }

        .search-hero-banner::after
        {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(7, 14, 23, 0.92) 0%, rgba(7, 14, 23, 0.55) 100%);
        }

        .search-hero-text
        {
            position: relative;
            z-index: 2;
            max-width: 620px;
        }

        .search-bar-grid
        {
            display: grid;
            grid-template-columns: 1fr auto 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .swap-btn
        {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            transition: transform 0.25s ease, border-color 0.2s ease;
        }

        .swap-btn:hover
        {
            border-color: var(--accent);
            transform: rotate(180deg);
        }

        .date-chips
        {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
            align-items: center;
        }

        .chip
        {
            padding: 5px 11px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
        }

        .chip:hover, .chip.active
        {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(245, 158, 11, 0.4);
        }

    
        .filter-bar
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .bus-card-top
        {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .bus-card-title-wrap
        {
            min-width: 0;
            flex: 1;
        }

        .bus-card-price-wrap
        {
            text-align: right;
            flex-shrink: 0;
        }

        .times
        {
            display: grid;
            grid-template-columns: minmax(72px, auto) 1fr minmax(72px, auto);
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            padding: 11px 14px;
            background: var(--surface-2);
            border-radius: 12px;
            border: 1px solid var(--line);
            width: 100%;
            overflow: hidden;
        }

        .time-endpoint
        {
            min-width: 0;
        }

        .time-endpoint.end-right
        {
            text-align: right;
        }

        .time-clock
        {
            font-family: "JetBrains Mono", monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            display: block;
            white-space: nowrap;
        }

        .time-city
        {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .time-mid
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            width: 100%;
            padding: 0 4px;
        }

        .time-dur-pill
        {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 2px 9px;
            white-space: nowrap;
            margin-bottom: 5px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time-line
        {
            width: 100%;
            border-top: 2px dashed var(--line-strong);
            margin: 0;
            display: block;
        }

        .bus-card-bottom
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .Seats-bar-wrap
        {
            width: 110px;
            height: 6px;
            background: var(--surface-2);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        .Seats-bar-fill
        {
            height: 100%;
            background: var(--go);
            border-radius: 99px;
        }

        
        .stepper
        {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .step-item
        {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--muted);
        }

        .step-item.active
        {
            color: var(--accent);
        }

        .step-item.done
        {
            color: var(--go);
        }

        .step-num
        {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            background: var(--surface-2);
            border: 1px solid var(--line);
        }

        .step-item.active .step-num
        {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .step-item.done .step-num
        {
            background: var(--go);
            color: #fff;
            border-color: var(--go);
        }

    
        .seats-layout
        {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 18px;
            align-items: start;
        }

        .bus-shell
        {
            background: var(--surface-2);
            border: 2px solid var(--line-strong);
            border-radius: 30px 30px 16px 16px;
            padding: 16px 14px 18px;
            width: max-content;
            max-width: 100%;
            margin: 10px auto 0;
            box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .bus-front
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 10px;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--line-strong);
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .srow
        {
            display: flex;
            gap: 7px;
            justify-content: center;
            align-items: center;
            margin-bottom: 7px;
        }

        .aisle
        {
            width: 24px;
            text-align: center;
            font-size: 10.5px;
            color: var(--muted);
            opacity: 0.6;
            font-family: "JetBrains Mono", monospace;
        }

        .seat
        {
            width: 44px;
            height: 42px;
            border-radius: 9px 9px 5px 5px;
            border: 1.5px solid var(--seat-border);
            background: var(--seat);
            color: var(--ink);
            font: 700 11.5px "JetBrains Mono", monospace;
            cursor: pointer;
            position: relative;
            transition: all 0.16s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .seat::after
        {
            content: "";
            width: 22px;
            height: 3.5px;
            border-radius: 4px;
            background: var(--line-strong);
            margin-top: 3px;
        }

        .seat:hover:not(:disabled)
        {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .seat.taken
        {
            background: var(--taken);
            color: var(--muted);
            border-color: var(--line);
            cursor: not-allowed;
            opacity: 0.55;
            text-decoration: line-through;
        }

        .seat.sel
        {
            background: linear-gradient(135deg, var(--go), #059669);
            color: #ffffff;
            border-color: var(--go);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        .seat.sel::after
        {
            background: rgba(255, 255, 255, 0.5);
        }

        .legend
        {
            display: flex;
            gap: 12px;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .legend-dot
        {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
            border: 1px solid var(--line-strong);
        }

        
        .pay-grid
        {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .pay-option
        {
            padding: 9px 6px;
            border-radius: 10px;
            border: 1.5px solid var(--line);
            background: var(--surface-2);
            color: var(--ink);
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .pay-option.active
        {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }

        
        .ticket
        {
            border-left: 5px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .ticket.cancelled
        {
            border-left-color: var(--muted);
            opacity: 0.68;
        }

        
        .modal-backdrop
        {
            position: fixed;
            inset: 0;
            background: rgba(7, 14, 23, 0.76);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box
        {
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
            padding: 22px;
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }

        .toast-container
        {
            position: fixed;
            bottom: 18px;
            right: 18px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 330px;
        }

        .toast
        {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line-strong);
            border-left: 5px solid var(--go);
            padding: 11px 14px;
            border-radius: 11px;
            box-shadow: var(--shadow-lg);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .toast.warn
        {
            border-left-color: var(--accent);
        }

        .toast.danger
        {
            border-left-color: var(--bad);
        }

        footer
        {
            border-top: 1px solid var(--line);
            padding: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 12.5px;
            background: var(--surface-glass);
        }

        /* Responsive Breakpoints */
        @media (max-width: 920px)
        {
            .auth-shell
            {
                grid-template-columns: 1fr;
            }
            .seats-layout
            {
                grid-template-columns: 1fr;
            }
            .search-bar-grid
            {
                grid-template-columns: 1fr 1fr;
            }
            .swap-btn
            {
                display: none;
            }
            .grid4
            {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 680px)
        {
            header
            {
                padding: 5px 10px;
                min-height: 44px;
                gap: 6px;
            }
            .brand-logo
            {
                width: 26px;
                height: 26px;
                border-radius: 7px;
            }
            .brand-logo svg
            {
                width: 16px;
                height: 16px;
            }
            .brand-title
            {
                font-size: 15.5px;
            }
            .brand-badge, .user-pill
            {
                display: none;
            }
            nav
            {
                gap: 3px;
            }
            nav button
            {
                padding: 4px 7px;
                font-size: 11.5px;
                border-radius: 7px;
            }
            .theme-btn
            {
                width: 26px;
                height: 26px;
                font-size: 12px;
                border-radius: 7px;
            }
            main
            {
                padding: 12px 10px 40px;
            }
            .card
            {
                padding: 14px;
                border-radius: 14px;
            }
            .search-hero
            {
                padding: 14px;
            }
            .search-hero-banner
            {
                padding: 16px;
            }
            .grid, .grid3, .search-bar-grid
            {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .pay-grid, .auth-feature-grid
            {
                grid-template-columns: 1fr 1fr;
            }
            .auth-panel, .auth-showcase
            {
                padding: 18px 14px;
            }
            .price
            {
                font-size: 19px;
            }
            .times
            {
                grid-template-columns: minmax(58px, auto) 1fr minmax(58px, auto);
                gap: 6px;
                padding: 9px 10px;
            }
            .time-clock
            {
                font-size: 15.5px;
            }
            .time-city
            {
                font-size: 11px;
                max-width: 96px;
            }
            .time-dur-pill
            {
                font-size: 10px;
                padding: 2px 6px;
            }
            .seat
            {
                width: 40px;
                height: 38px;
                font-size: 11px;
            }
        }
    </style>
</head>

        const store =
        {
            get: function(k, d)
            {
                try
                {
                    const v = localStorage.getItem(k);
                    return v ? JSON.parse(v) : d;
                }
                catch (e)
                {
                    return d;
                }
            },
            set: function(k, v)
            {
                try
                {
                    localStorage.setItem(k, JSON.stringify(v));
                }
                catch (e)
                {
                }
            }
        };

        const mem =
        {
            users: store.get('bb_users', {}),
            session: store.get('bb_session', null),
            bookings: store.get('bb_bookings', []),
            theme: store.get('bb_theme', 'dark')
        };

        function save()
        {
            store.set('bb_users', mem.users);
            store.set('bb_session', mem.session);
            store.set('bb_bookings', mem.bookings);
            store.set('bb_theme', mem.theme);
        }

        function applyTheme()
        {
            document.documentElement.setAttribute('data-theme', mem.theme);
        }

        function toggleTheme()
        {
            mem.theme = mem.theme === 'dark' ? 'light' : 'dark';
            save();
            applyTheme();
            render();
        }

        function addDays(baseStr, days)
        {
            const d = baseStr ? new Date(baseStr + 'T00:00:00') : new Date();
            d.setDate(d.getDate() + days);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function today()
        {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function esc(s)
        {
            return String(s || '').replace(/[&<>"']/g, function(c)
            {
                const map =
                {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return map[c];
            });
        }

        function taka(n)
        {
            return '৳' + Math.round(n).toLocaleString('en-US');
        }

        function timeSlotOf(dep)
        {
            const hr = parseInt(dep.split(':')[0], 10);
            if (hr < 12)
            {
                return 'Morning';
            }
            if (hr < 18)
            {
                return 'Afternoon';
            }
            return 'Night';
        }

        function busesFor(from, to)
        {
            if (!from || !to || from === to)
            {
                return [];
            }
            const fDist = DIST[from] || [0, 150];
            const tDist = DIST[to] || [1, 300];
            const km = Math.abs(fDist[1] - tDist[1]) || 160;
            const d = Math.max(km, 120) + ((fDist[0] + tDist[0]) % 3) * 35;

            return OPS.map(function(o, i)
            {
                const parts = o[3].split(':').map(Number);
                const h = parts[0];
                const m = parts[1];
                const mins = Math.round((d / 48) * 60);
                const end = (h * 60 + m + mins) % 1440;
                const f = function(n)
                {
                    return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
                };
                return {
                    id: from + '-' + to + '-' + i,
                    name: o[0],
                    type: o[1],
                    from: from,
                    to: to,
                    dep: o[3],
                    arr: f(end),
                    mins: mins,
                    dur: Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm',
                    km: d,
                    price: Math.round((d * o[2]) / 10) * 10,
                    rating: o[4],
                    amenities: o[5],
                    coachModel: o[6],
                    slot: timeSlotOf(o[3])
                };
            });
        }

        function showToast(message, kind)
        {
            const root = document.getElementById('toastRoot');
            if (!root)
            {
                return;
            }
            const el = document.createElement('div');
            el.className = 'toast ' + (kind || '');
            el.innerHTML = '<span>' + esc(message) + '</span>';
            root.appendChild(el);
            setTimeout(function()
            {
                if (el.parentNode)
                {
                    el.parentNode.removeChild(el);
                }
            }, 3400);
        }

        
        async function hash(email, pw)
        {
            try
            {
                const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email + ':' + pw));
                return Array.from(new Uint8Array(b)).map(function(x)
                {
                    return x.toString(16).padStart(2, '0');
                }).join('');
            }
            catch (e)
            {
                return btoa(email + ':' + pw);
            }
        }

        function updatePwMeter(val)
        {
            let score = 0;
            if (val.length >= 6)
            {
                score++;
            }
            if (val.length >= 9)
            {
                score++;
            }
            if (/[A-Z]/.test(val) || /\d/.test(val))
            {
                score++;
            }
            if (/[^A-Za-z0-9]/.test(val) && val.length >= 8)
            {
                score++;
            }

            const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
            const labels = ['Weak password', 'Fair password', 'Good password', 'Strong password'];

            for (let i = 1; i <= 4; i++)
            {
                const bar = document.getElementById('pwBar' + i);
                if (bar)
                {
                    bar.style.background = i <= score ? colors[score - 1] : 'var(--line)';
                }
            }
            const lbl = document.getElementById('pwLabel');
            if (lbl)
            {
                lbl.textContent = val.length === 0 ? 'Use 6+ characters with letters & numbers' : labels[Math.max(0, score - 1)];
            }
        }

        async function submitAuth()
        {
            const eInput = document.getElementById('e');
            const pInput = document.getElementById('p');
            const err = document.getElementById('err');
            const e = eInput ? eInput.value.trim().toLowerCase() : '';
            const p = pInput ? pInput.value : '';

            if (!/^\S+@\S+\.\S+$/.test(e))
            {
                err.textContent = 'Enter a valid email address.';
                return;
            }
            if (p.length < 6)
            {
                err.textContent = 'Password must be at least 6 characters.';
                return;
            }

            const h = await hash(e, p);
            if (S.mode === 'register')
            {
                const nInput = document.getElementById('n');
                const n = nInput ? nInput.value.trim() : '';
                const regPhone = document.getElementById('regPhone') ? document.getElementById('regPhone').value.trim() : '';
                const regCity = document.getElementById('regCity') ? document.getElementById('regCity').value : 'Dhaka';

                if (!n)
                {
                    err.textContent = 'Enter your full name.';
                    return;
                }
                if (mem.users[e])
                {
                    err.textContent = 'This email already has an account. Log in instead.';
                    return;
                }
                mem.users[e] =
                {
                    name: n,
                    email: e,
                    phone: regPhone,
                    city: regCity,
                    h: h
                };
                showToast('Welcome aboard, ' + n + '! Account created.', 'ok');
            }
            else
            {

                {
                    err.textContent = 'Email or password is incorrect.';
                    return;
                }
                showToast('Signed in as ' + mem.users[e].name, 'ok');

            mem.session = e;
            save();
            S.view = 'search';
            if (!S.results)

        function calcFareBreakdown(bus, seatCount, promo)
        {
            const base = seatCount * bus.price;
            const serviceFee = seatCount > 0 ? seatCount * 20 : 0;
            let discount = 0;

            if (promo && seatCount > 0)
            {
                if (promo.type === 'pct')
                {
                    discount = Math.round(base * (promo.val / 100));
                }
                else if (promo.type === 'flat')
                {
                    discount = Math.min(base, promo.val);
                }
                else if (promo.type === 'group' && seatCount >= 3)
                {
                    discount = Math.round(base * (promo.val / 100));
                }
            }

            const total = Math.max(0, base + serviceFee - discount);
            return {
                base: base,
                serviceFee: serviceFee,
                discount: discount,
                total: total
            };
        }

        function preservePassengerInputs(fn)
        {
            const pn = document.getElementById('pn');
            const ph = document.getElementById('ph');
            const a = pn && pn.value;
            const b = ph && ph.value;
            fn();
            render();
            if (a && document.getElementById('pn'))
            {
                document.getElementById('pn').value = a;
            }
            if (b && document.getElementById('ph'))
            {
                document.getElementById('ph').value = b;
            }
        }

        function toggle(id)
        {
            preservePassengerInputs(function()
            {
                const i = S.sel.indexOf(id);
                if (i >= 0)
                {
                    S.sel.splice(i, 1);
                    S.msg = '';
                }
                else if (S.sel.length >= 6)
                {
                    S.msg = 'You can book up to 6 seats at a time.';
                }
                else
                {
                    S.sel.push(id);
                    S.msg = '';
                }
            });
        }

        function selectPayMethod(pm)
        {
            preservePassengerInputs(function()
            {
                S.payMethod = pm;
            });
        }

        function quickPromo(code)
        {
            S.promoCode = code;
            applyPromoByName(code);
        }

        function applyPromoCode()
        {
            const inp = document.getElementById('promoIn');
            const code = inp ? inp.value.trim().toUpperCase() : '';
            S.promoCode = code;
            applyPromoByName(code);
        }

        function applyPromoByName(code)
        {
            preservePassengerInputs(function()
            {
                const p = PROMOS[code];
                if (!p)
                {
                    S.appliedPromo = null;
                    S.msg = 'Invalid promo code. Try STUDENT15, FIRST100, or GROUP20.';
                    return;
                }
                if (p.type === 'group' && S.sel.length < 3)
                {
                    S.appliedPromo = p;
                    S.msg = 'GROUP20 applied! Select at least 3 seats to activate 20% off.';
                    return;
                }
                S.appliedPromo = p;
                S.msg = '';
                showToast('Promo ' + code + ' applied: ' + p.label, 'ok');
            });
        }

        function keep(n, p)
        {
            render();
            if (document.getElementById('pn'))
            {
                document.getElementById('pn').value = n;
            }
            if (document.getElementById('ph'))
            {
                document.getElementById('ph').value = p;
            }
        }

        function confirmBooking()
        {
            const name = document.getElementById('pn').value.trim();
            const phone = document.getElementById('ph').value.trim();

            if (!name)
            {
                S.msg = 'Enter the passenger name.';
                keep(name, phone);
                return;
            }
            if (!/^(\+?88)?01\d{9}$/.test(phone.replace(/[\s-]/g, '')))
            {
                S.msg = 'Enter a valid phone number, like 01712345678.';
                keep(name, phone);
                return;
            }

            const tk = taken(S.bus.id, S.search.date);
            const conflict = S.sel.some(function(s)
            {
                return tk.indexOf(s) >= 0;
            });

            if (conflict)
            {
                S.sel = S.sel.filter(function(s)
                {
                    return tk.indexOf(s) === -1;
                });
                S.msg = 'Some seats were just taken. Choose different seats.';
                keep(name, phone);
                return;
            }

            const fare = calcFareBreakdown(S.bus, S.sel.length, S.appliedPromo);
            const newTicket =
            {
                id: 'BK' + Math.random().toString(36).slice(2, 8).toUpperCase(),
                user: mem.session,
                busId: S.bus.id,
                bus: S.bus.name,
                type: S.bus.type,
                from: S.bus.from,
                to: S.bus.to,
                dep: S.bus.dep,
                arr: S.bus.arr,
                date: S.search.date,
                seats: S.sel.slice(),
                boarding: S.boarding || 'Main Terminal',
                dropping: S.dropping || 'Central Stand',
                payMethod: S.payMethod,
                promo: S.appliedPromo ? S.appliedPromo.code : null,
                total: fare.total,
                passenger: name,
                phone: phone,
                status: 'confirmed',
                at: Date.now()
            };

            mem.bookings.push(newTicket);
            save();
            S.view = 'bookings';
            S.msg = 'Booking confirmed. Your ticket is below.';
            showToast('Booking ' + newTicket.id + ' confirmed!', 'ok');
            render();
        }


        function vBookings()
        {
            const allMine = mem.bookings
                .filter(function(b)
                {
                    return b.user === mem.session;
                })
                .sort(function(a, b)
                {
                    return b.at - a.at;
                });

            const confirmedList = allMine.filter(function(b)
            {
                return b.status === 'confirmed';
            });

            const totalSpent = confirmedList.reduce(function(acc, b)
            {
                return acc + b.total;
            }, 0);

            const loyaltyPts = Math.round(totalSpent / 10);

            const filtered = allMine.filter(function(b)
            {
                if (S.ticketFilter !== 'all' && b.status !== S.ticketFilter)
                {
                    return false;
                }
                if (S.ticketQuery)
                {
                    const q = S.ticketQuery.toLowerCase();
                    const hay = (b.id + ' ' + b.from + ' ' + b.to + ' ' + b.bus + ' ' + b.passenger).toLowerCase();
                    if (hay.indexOf(q) === -1)
                    {
                        return false;
                    }
                }
                return true;
            });

            const statsHtml = '' +

                    '</div>' +
                    '<div class="card" style="padding: 13px; margin-bottom: 0;">' +

                        '<div class="price">' + allMine.length + '</div>' +

                    '</div>' +
                    '<div class="card" style="padding: 13px; margin-bottom: 0;">' +
                        '<span class="muted">Reward Points</span>' +
                        '<div class="price" style="color: var(--accent);">★ ' + loyaltyPts + '</div>' +
                    '</div>' +
                '</div>';

            const filterBar = '' +
                '<div class="filter-bar">' +
                    '<div class="row" style="gap: 6px;">' +
                        '<button class="chip ' + (S.ticketFilter === 'all' ? 'active' : '') + '" onclick="setTicketFilter(\'all\')">All (' + allMine.length + ')</button>' +
                        '<button class="chip ' + (S.ticketFilter === 'confirmed' ? 'active' : '') + '" onclick="setTicketFilter(\'confirmed\')">Confirmed (' + confirmedList.length + ')</button>' +
                        '<button class="chip ' + (S.ticketFilter === 'cancelled' ? 'active' : '') + '" onclick="setTicketFilter(\'cancelled\')">Cancelled</button>' +
                    '</div>' +
                    '<div style="min-width: 200px; flex: 1; max-width: 300px;">' +
                        '<input placeholder="Search PNR, city, or operator..." value="' + esc(S.ticketQuery) + '" oninput="setTicketQuery(this.value)" style="padding: 7px 11px; font-size: 12.5px;">' +
                    '</div>' +
                '</div>';

            const listHtml = filtered.length
                ? filtered.map(function(b)
                {
                    const isConf = b.status === 'confirmed';
                    return '' +
                        '<div class="card ticket ' + b.status + '">' +
                            '<div class="bus-card-top">' +
                                '<div class="bus-card-title-wrap">' +
                                    '<div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;">' +
                                        '<span class="mono tag" style="font-weight: 700;">' + esc(b.id) + '</span>' +
                                        '<span class="tag ' + (isConf ? 'green' : '') + '">' + (isConf ? '✓ Confirmed' : '✕ Cancelled') + '</span>' +
                                        '<span class="tag sleeper">Seats: ' + esc(b.seats.join(', ')) + '</span>' +
                                    '</div>' +
                                    '<b style="font-size: 18px; display: block;">' + esc(b.from) + ' → ' + esc(b.to) + '</b>' +
                                    '<div class="muted" style="font-size: 12px;">' + esc(b.bus) + ' (' + esc(b.type) + ') • ' + esc(b.date) + '</div>' +
                                '</div>' +
                                '<div class="bus-card-price-wrap">' +
                                    '<div class="price">' + taka(b.total) + '</div>' +
                                    (b.payMethod ? '<span class="muted" style="font-size: 11px;">' + esc(b.payMethod) + '</span>' : '') +
                                '</div>' +
                            '</div>' +

                            '<div class="times">' +
                                '<div class="time-endpoint">' +
                                    '<span class="time-clock">' + b.dep + '</span>' +
                                    '<div class="time-city">' + esc(b.boarding || b.from) + '</div>' +
                                '</div>' +
                                '<div class="time-mid">' +
                                    '<span class="time-dur-pill">' + esc(b.date) + '</span>' +
                                    '<i class="time-line"></i>' +
                                '</div>' +
                                '<div class="time-endpoint end-right">' +
                                    '<span class="time-clock">' + b.arr + '</span>' +
                                    '<div class="time-city">' + esc(b.dropping || b.to) + '</div>' +

                                '<div class="row" style="gap: 6px;">' +

                statsHtml +
                filterBar +
                listHtml;
        }

        {

        function copyPnr(id)
        {
            try
            {
                if (navigator.clipboard && navigator.clipboard.writeText)
                {
                    navigator.clipboard.writeText(id);
                }
                else
                {
                    const ta = document.createElement('textarea');
                    ta.value = id;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
            }
            catch (e)
            {
            }
            showToast('Copied Ticket PNR: ' + id, 'ok');
        }

                            '<div class="time-endpoint">' +
                                '<span class="time-clock">' + b.dep + '</span>' +
                                '<div class="time-city">' + esc(b.from) + '</div>' +
                            '</div>' +
                            '<div class="time-mid">' +
                                '<span class="time-dur-pill">' + esc(b.date) + '</span>' +
                                '<i class="time-line"></i>' +
                            '</div>' +
                            '<div class="time-endpoint end-right">' +
                                '<span class="time-clock">' + b.arr + '</span>' +
                                '<div class="time-city">' + esc(b.to) + '</div>' +
                            '</div>' +
                        '</div>' +

                        '<div class="grid" style="background: var(--surface-2); padding: 12px; border-radius: 12px; margin-bottom: 14px;">' +
                            '<div><span class="muted">Passenger</span><b style="display:block;">' + esc(b.passenger) + '</b></div>' +
                            '<div><span class="muted">Phone</span><b style="display:block;">' + esc(b.phone) + '</b></div>' +
                            '<div><span class="muted">Boarding</span><b style="display:block; font-size:12.5px;">' + esc(b.boarding || b.from) + '</b></div>' +
                            '<div><span class="muted">Seats</span><b class="mono" style="display:block; color: var(--accent);">' + esc(b.seats.join(', ')) + '</b></div>' +
                        '</div>' +

                        '<div class="row" style="justify-content: space-between;">' +
                            '<div><span class="muted">Total Paid</span><div class="price">' + taka(b.total) + '</div></div>' +
                            '<div class="row" style="gap: 8px;">' +
                                '<button class="btn ghost sm" onclick="window.print()">🖨️ Print</button>' +
                                '<button class="btn sm" onclick="closeModal()">Done</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }

    
        function vOffers()
        {
            const promoCards = Object.keys(PROMOS).map(function(k)
            {
                const p = PROMOS[k];
                return '' +
                    '<div class="card card-interactive">' +
                        '<div class="row" style="margin-bottom: 8px;">' +
                            '<span class="tag sleeper">ACTIVE OFFER</span>' +
                            '<span class="mono tag" style="font-weight: 700;">' + esc(p.code) + '</span>' +
                        '</div>' +
                        '<h2 style="font-size: 18px; margin-bottom: 6px;">' + esc(p.label) + '</h2>' +
                        '<p class="muted" style="margin-bottom: 14px;">' + esc(p.desc) + '</p>' +
                        '<button class="btn ghost sm" onclick="useOfferCode(\'' + esc(p.code) + '\')">Apply & Search Buses →</button>' +
                    '</div>';
            }).join('');

            return '' +
                '<div class="row" style="margin-bottom: 14px;">' +
                    '<div>' +
                        '<h1 style="font-size: 24px;">Exclusive Offers & Promo Codes</h1>' +
                        '<p class="muted" style="margin: 4px 0 0;">Tap any promo below to automatically apply it to your next seat reservation.</p>' +
                    '</div>' +
                    '<button class="btn ghost sm" onclick="go(\'search\')">← Back to Booking</button>' +
                '</div>' +
                '<div class="grid3">' + promoCards + '</div>';
        }

        function useOfferCode(code)
        {
            S.promoCode = code;
            S.appliedPromo = PROMOS[code];
            showToast('Promo ' + code + ' pre-loaded for checkout!', 'ok');
            go('search');
        }

        render();
    </script>
</body>
</html>
